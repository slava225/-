name: Build Video Translator APK

on:
  push:
    branches: [ video-translator-ru ]
    paths:
      - 'VideoTranslatorRU/**'
      - '.github/workflows/build-video-translator.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: VideoTranslatorRU
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chinese-Russian-Live-Translator-APK
          path: VideoTranslatorRU/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
