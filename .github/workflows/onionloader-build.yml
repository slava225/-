name: Build OnionLoader Android APK
on:
  push:
    branches:
      - onionloader-build
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Assemble APK
        run: |
          base64 -d onionloader-source.b64 > /tmp/onionloader-source.zip
          unzip -qq /tmp/onionloader-source.zip -d /tmp
          cd /tmp/OnionLoaderAndroid
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/OnionLoader.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: OnionLoader-APK
          path: OnionLoader.apk
      - name: Publish APK in isolated build branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f OnionLoader.apk
          git commit -m "Publish compiled OnionLoader APK"
          git push origin HEAD:onionloader-build
